name: mec_bicubic_x8_cnn_stage1
scale: 8
save_checkpoint_freq: 1000.0
datasets:
  train:
    name: train
    mode: train
    if_dilate: true
    shift_channels: null
    output_nc: 12
    separate_weight: false
    if_sparse: false
    dataset_name: wafer
    data_folder_gt: wafer_gt
    data_folder_lr: wafer_bic_downsample_h5_x8
    train_split: 125
    test_split: 125
    if_scale_aug: false
    if_filp_aug: true
    if_elastic_aug: false
    if_intensity_aug: false
    if_rotation_aug: false
    n_workers: 8
    batch_size: 8
  val:
    name: val
    mode: val
    if_dilate: true
    shift_channels: null
    output_nc: 12
    separate_weight: false
    if_sparse: false
    dataset_name: wafer
    data_folder_gt: wafer_gt
    data_folder_lr: wafer_bic_downsample_h5_x8
    train_split: 125
    test_split: 125
    if_scale_aug: false
    if_filp_aug: true
    if_elastic_aug: false
    if_intensity_aug: false
    if_rotation_aug: false
network:
  w_att: true
  scale: 8
pretrain: {}
train:
  current_step: 0
  start_epoch: 0
  lr_G: 0.0001
  lr_scheme: CosineAnnealingLR_Restart
  beta1: 0.9
  beta2: 0.99
  niter: 120000
  T_period:
  - 120000
  - 20000
  restarts:
  - 120000
  eta_min: 1.0e-05
  val_freq: 1000.0
  loss_type: l1
  w_BCE_loss: false
  logger_freq: 100
  other_lr_multiplier: 10.0
  restart_weights:
  - 1
  validation_start: 0
stage: 1
backbone: cnn
setting: mec_bicubic_x8_cnn
checkpoint: checkpoints/mec_bicubic_x8_cnn/stage1.pth

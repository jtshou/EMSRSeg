  val:
    name: val
    mode: val
    if_dilate: true
    shift_channels: null
    output_nc: 12
    separate_weight: false
    if_sparse: false
    dataset_name: wafer
    data_folder_gt: wafer_gt
    data_folder_lr: wafer_emfwd_downsample_h5_x4
    train_split: 125
    test_split: 125

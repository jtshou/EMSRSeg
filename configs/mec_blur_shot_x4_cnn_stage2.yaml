    output_nc: 12
    separate_weight: false
    if_sparse: false
    dataset_name: wafer
    data_folder_gt: wafer_gt
    data_folder_lr: wafer_emfwd_downsample_h5_x4
    train_split: 125
    test_split: 125
    if_scale_aug: false
    if_filp_aug: true
    if_elastic_aug: false
    if_intensity_aug: false
    if_rotation_aug: false
    n_workers: 8
